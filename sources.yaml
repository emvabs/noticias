# Fontes de notícias (RSS oficiais). Para desativar uma fonte: enabled: false.
# O "id" é usado na API (?sources=publico,rtp).
#   scope:    portugal | world   -> separador Portugal / Mundo
#   language: pt | en            -> escolhe o léxico usado na análise
#   author_from: feed | none  -> o feed traz o nome do jornalista (omissão: feed),
#       ou none quando o que traz não é um nome.
#   user_agent: "..."  -> só para fontes que recusam o fetch.user_agent de config.yaml
#   summary_from: feed | none -> none guarda só o título, quando o resumo do feed
#       não é o do artigo (Google News).
sources:
  # ---------------- PORTUGAL ----------------
  - id: publico
    name: Público
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    feeds:
      - https://feeds.feedburner.com/PublicoRSS   # ligado a partir de publico.pt (só ~10 itens por pedido)

  - id: expresso
    name: Expresso
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    feeds:
      - https://feeds.feedburner.com/expresso-geral

  - id: observador
    name: Observador
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    feeds:
      - https://observador.pt/feed/

  - id: rtp
    name: RTP Notícias
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    author_from: none   # o feed não indica o jornalista
    feeds:
      - https://www.rtp.pt/noticias/rss

  - id: cnn
    name: CNN Portugal
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    feeds:
      - https://cnnportugal.iol.pt/rss.xml   # anunciado no <head> do site

  - id: dn
    name: Diário de Notícias
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    feeds:
      - https://www.dn.pt/stories.rss   # destino de dn.pt/feed (sem resumos)

  # SIC e JN não têm RSS próprio (verificado em 2026-09-21): a SIC está protegida
  # por DataDome e bloqueia bots; o feed antigo do JN parou em 2023 e o robots.txt
  # proíbe navegação automática. Entram pelo RSS público do Google News: só título,
  # data e link (via Google). Não abrir as páginas dos artigos. Sem jornalista nem
  # resumo; "when:1d" evita páginas antigas (verificado em 2026-10-14).
  - id: sic
    name: SIC Notícias
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    author_from: none
    summary_from: none
    feeds:
      - https://news.google.com/rss/search?q=site:sicnoticias.pt+when:1d&hl=pt-PT&gl=PT&ceid=PT:pt-150

  - id: jn
    name: Jornal de Notícias
    scope: portugal
    language: pt
    group: mainstream
    enabled: true
    author_from: none
    summary_from: none
    feeds:
      - https://news.google.com/rss/search?q=site:jn.pt+when:1d&hl=pt-PT&gl=PT&ceid=PT:pt-150

  # ---------------- INDEPENDENTES (Portugal) ----------------
  # Publicam poucas peças por semana — ver "groups.independent" em config.yaml.
  - id: fumaca
    name: Fumaça
    scope: portugal
    language: pt
    group: independent
    enabled: true
    feeds:
      - https://fumaca.pt/feed/          # feed de podcast: resumos longos, cortados a 300 caracteres

  - id: divergente
    name: Divergente
    scope: portugal
    language: pt
    group: independent
    enabled: true
    feeds:
      # O feed principal (divergente.pt/feed/) só tem o artigo "Olá, mundo!" por
      # omissão do WordPress; as reportagens estão no tipo de conteúdo "trabalho".
      - https://divergente.pt/feed/?post_type=trabalho

  - id: shifter
    name: Shifter
    scope: portugal
    language: pt
    group: independent
    enabled: true
    feeds:
      - https://shifter.pt/feed/

  - id: lpp
    name: Lisboa Para Pessoas
    scope: portugal
    language: pt
    group: independent
    enabled: true
    feeds:
      - https://lisboaparapessoas.pt/feed/

  - id: oregioes
    name: oRegiões
    scope: portugal
    language: pt
    group: independent
    enabled: true
    feeds:
      - https://oregioes.pt/feed/

  # ---------------- MUNDO ----------------
  - id: bbc
    name: BBC News
    scope: world
    language: en
    group: mainstream
    enabled: true
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml

  - id: guardian
    name: The Guardian
    scope: world
    language: en
    group: mainstream
    enabled: true
    feeds:
      - https://www.theguardian.com/world/rss

  - id: dw
    name: Deutsche Welle
    scope: world
    language: en
    group: mainstream
    enabled: true
    feeds:
      - https://rss.dw.com/rdf/rss-en-world

  - id: euronews
    name: Euronews
    scope: world
    language: en
    group: mainstream
    enabled: true
    feeds:
      - https://www.euronews.com/rss?level=theme&name=news

  - id: aljazeera
    name: Al Jazeera
    scope: world
    language: en
    group: mainstream
    enabled: true
    feeds:
      - https://www.aljazeera.com/xml/rss/all.xml

  # Sem RSS a funcionar (verificado em 2026-09-23):
  # Reuters: feeds.reuters.com foi desativado e reuters.com devolve 401 a pedidos automáticos.
  - id: reuters
    name: Reuters
    scope: world
    language: en
    group: mainstream
    enabled: false
    feeds: []

  # Associated Press: todos os caminhos .rss devolvem 403 (proteção anti-robôs); sem feed público.
  - id: ap
    name: Associated Press
    scope: world
    language: en
    group: mainstream
    enabled: false
    feeds: []
