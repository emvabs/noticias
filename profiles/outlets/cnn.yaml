name: CNN Portugal
type: Canal de notícias por cabo e site (privado), lançado em 2021
owner: Media Capital (também dona da TVI); maior acionista Pluris Investments, de Mário Ferreira (37,11%), que preside ao conselho de administração
summary: >
  Canal de notícias da Media Capital, lançado em 2021 no lugar da TVI24 e
  operado com a marca CNN ao abrigo de uma licença. O empresário Mário
  Ferreira, através da Pluris Investments, é o maior acionista e o presidente
  do conselho de administração da Media Capital.
funding:
  - text: Em 2025 a Media Capital teve um resultado líquido ajustado de 6,0 milhões de euros e rendimentos operacionais ajustados de 172,4 milhões, dos quais 111,3 milhões de publicidade; a dívida líquida era de 28,7 milhões.
    source: https://mediacapital.pt/wp-content/uploads/2026/03/PR-MEDIA-CAPITAL-RESULTADOS_2025.pdf
  - text: Em maio de 2026 os acionistas aprovaram 3,5 milhões de euros de dividendos e reconduziram Mário Ferreira como presidente do conselho de administração para 2026–2028.
    source: https://eco.sapo.pt/2026/05/20/media-capital-reconduz-administracao-e-aprova-35-milhoes-em-dividendos/
political_links:
  official: []
  reported: []
narrative:
  - text: Criada em 2021 para substituir a TVI24, ao abrigo de um acordo com a Turner Broadcasting System Europe; o canal é programado e operado pela Media Capital sob licença da CNN.
    source: https://observador.pt/2021/05/24/media-capital-vai-lancar-a-cnn-portugal/
  - text: Em 2023 a ERC aplicou à Pluris, à Prisa e à Vertix (do grupo Prisa) uma coima de 350 mil euros a cada uma, metade suspensa por dois anos, por terem mudado o controlo da Media Capital em 2020 sem autorização prévia do regulador.
    source: https://observador.pt/2023/07/11/mario-ferreira-e-prisa-multadas-pela-erc-por-terem-feito-negocio-da-media-capital-antes-de-informarem-regulador/
  - text: O presidente do FC Porto, André Villas-Boas, disse ter falado diretamente com Mário Ferreira sobre o tratamento que os comentadores do grupo davam ao clube.
    source: https://www.record.pt/multimedia/videos/fc-porto/detalhe/villas-boas-e-o-tratamento-dos-comentadores-falei-com-mario-ferreira
