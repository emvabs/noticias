name: Público
type: Diário generalista nacional (privado), fundado em 1990
owner: Sonae, através da Sonaecom (Público – Comunicação Social, SA); a Sonae SGPS detém 88,84% da Sonaecom
summary: >
  Diário do grupo Sonae, através da Sonaecom. Tem dado prejuízo nos últimos
  anos (4,48 milhões de euros em 2023 e 5,1 milhões em 2024) e a Sonaecom
  cobre as perdas: 6,7 milhões em 2024 e 4,0 milhões em 2025.
funding:
  - text: A Sonaecom cobriu prejuízos do Público no valor de 6,7 milhões de euros em 2024 e de 4,0 milhões em 2025, e registou imparidades no investimento no jornal nesses dois anos.
    source:
      - https://sonaecom.pt/2025/04/07/Relatorio_Sonaecom_FY24_PT_nao_ESEF.pdf
      - https://live.euronext.com/sites/default/files/company_press_releases/attachments/2026/03/26/Connect_rc-sonaecom-pt-dez-25nao-esef.pdf
  - text: Prejuízo de 5,1 milhões de euros em 2024, contra 4,48 milhões em 2023, com receitas de 16,4 milhões; a administração atribuiu o agravamento sobretudo ao programa de rescisões voluntárias. Dados do Portal da Transparência da ERC.
    source: https://eco.sapo.pt/2025/07/31/publico-fecha-2024-com-prejuizo-de-51-milhoes-cristina-soares-justifica-resultados-com-a-reestruturacao/
