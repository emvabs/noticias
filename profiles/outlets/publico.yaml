narrative:
  - text: No lançamento (1990) a administração e a direção de Vicente Jorge Silva assinaram um "pacto" que garante a independência da redação face ao acionista.
    source: https://www.publico.pt/2017/11/29/economia/noticia/o-pacto-de-belmiro-com-publico-de-marco-de-1990-1794366
