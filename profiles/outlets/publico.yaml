name: Público
type: Diário generalista nacional (privado), fundado em 1990
owner: Sonae, através da Sonaecom (Público – Comunicação Social, SA)
summary: >
  Jornal de referência criado pela Sonae de Belmiro de Azevedo. Dá prejuízo
  todos os anos e sobrevive porque o acionista cobre as perdas.
funding:
  - text: A Sonae injetou 10,7 milhões de euros entre 2024 e 2025 para cobrir prejuízos; no total investiu cerca de 52,6 milhões, já considerados perdidos nas contas da Sonaecom.
    source: https://paginaum.pt/2026/07/17/sonae-ja-enterrou-no-jornal-publico-quase-53-milhoes-de-euros-sem-esperanca-de-recuperar
  - text: Prejuízo de 5,1 milhões de euros em 2024, o pior da série recente.
    source: https://eco.sapo.pt/2025/07/31/publico-fecha-2024-com-prejuizo-de-51-milhoes-cristina-soares-justifica-resultados-com-a-reestruturacao/
