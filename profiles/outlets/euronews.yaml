name: Euronews
type: Canal de notícias pan-europeu (privado), sediado em Bruxelas
owner: Alpac Capital (97,6%), gestora portuguesa cujos beneficiários efetivos são Pedro Vargas David e Luís Santos; outros acionistas ADMIC, SNRT e PBS
summary: >
  Canal europeu comprado em 2022 por um fundo português. Investigações
  jornalísticas ligaram parte do dinheiro da compra ao Estado húngaro e a
  pessoas próximas de Viktor Orbán. A Alpac e a Euronews negam ingerência
  editorial.
funding:
  - text: Segundo o Tribunal de Contas Europeu (2019), a Comissão Europeia comprometeu cerca de 122 milhões de euros com a Euronews entre 2014 e 2018 (cerca de 24,5 milhões por ano), 38% do volume de negócios em 2018, incluindo serviços em árabe, persa, grego, húngaro e português.
    source: https://www.eca.europa.eu/lists/ecadocuments/rcr_euronews/rcr_euronews_en.pdf
  - text: Segundo a própria Euronews, as receitas chegaram a 77 milhões de euros em 2025 e o financiamento da UE pesou cerca de 16%, o valor mais baixo da sua história.
    source: https://www.euronews.com/2026/01/29/euronews-group-delivers-record-financial-results-as-part-of-three-year-turnaround
  - text: Segundo a Direkt36, o Le Monde e o Expresso, cerca de 45 milhões de euros da compra vieram de fundos Széchenyi, controlados pelo Estado húngaro.
    source: https://www.direkt36.hu/en/bizalmas-iratok-leplezik-le-hogy-orbanek-titokban-finansziroztak-az-egyik-legnagyobb-europai-tevecsatorna-megvasarlasat/
political_links:
  official: []
  reported:
    - text: Pedro Vargas David é filho de Mário David, antigo eurodeputado português e vice-presidente do PPE, que foi conselheiro de Viktor Orbán para assuntos europeus até 2021.
      source: https://www.rferl.org/a/hungary-euronews-orban-david/31619957.html
    - text: Documentos revelados indicam que a New Land Media, agência que geriu campanhas do Governo de Orbán, participou no financiamento da compra.
      source: https://vsquare.org/euronews-viktor-orban-media-money-hungary-portugal/
narrative:
  - text: Em agosto de 2026 a Alpac, através da European Future Media Investments, concluiu a compra à United Group dos meios da Adria News Network (N1, Nova S, Nova.rs, Radar e Danas), descritos pela imprensa da região como independentes; a Federação Europeia de Jornalistas pediu escrutínio regulatório por risco de concentração.
    source:
      - https://europeanwesternbalkans.com/2026/08/17/alpac-capital-takes-over-united-groups-media-outlets-in-serbia/
      - https://srpske.rs/en/news/politika/2026/08/26/n1-nova-s-danas-officially-change-owners
      - https://europeanjournalists.org/blog/2026/08/18/western-balkans-proposed-sale-of-the-ann-to-alpac-capital-european-future-media-investment-requires-urgent-regulatory-scrutiny/
  - text: Em 2024 o Sindicato Nacional dos Jornalistas francês (SNJ) pediu um inquérito parlamentar à compra, depois de se saber que pelo menos um terço dos cerca de 170 milhões de euros vinha de fontes ligadas ao Governo de Viktor Orbán.
    source: https://europeanjournalists.org/blog/2024/04/17/french-journalists-union-calls-for-the-opening-of-a-parliamentary-inquiry-into-euronews-takeover/
  - text: Em 2024 a ERC investigou se o dinheiro do Estado húngaro chegava aos meios portugueses da Alpac (Newsplex, dona do Nascer do Sol e do i) e arquivou o processo, por não encontrar poderes de influência nem falta de transparência.
    source: https://www.erc.pt/document.php?id=ODFhODgyYWYtYTkzYS00MGRmLWIxZTItMTZiYTAxNjMxZDk1
owners:
