name: Lisboa Para Pessoas (LPP)
type: Jornal local da Área Metropolitana de Lisboa (digital e 3 edições impressas por ano), lançado em 2021
owner: Shifter Generation, Lda; diretor e editor Mário Rui André
summary: >
  Jornalismo de proximidade sobre a área metropolitana de Lisboa: mobilidade,
  habitação, cidadania e comunidades. Diz ser editado sem fins lucrativos,
  embora pertença a uma sociedade por quotas, a mesma que publica o Shifter.
funding:
  - text: Assinaturas, donativos, venda da edição impressa (3 vezes por ano) e publicidade. Em 2022 lançou um crowdfunding de 10 mil euros para assegurar o projeto até ao fim do ano; o fundador escreveu que até então trabalhava por menos do salário mínimo.
    source:
      - https://lisboaparapessoas.pt/sobre/
      - https://lisboaparapessoas.pt/2022/03/14/lisboa-para-pessoas-crowdfunding-manifesto/
political_links:
  official: []
  reported: []
narrative:
  - text: Declara ser editado "de forma totalmente independente e sem fins lucrativos" ("procura receitas, não lucros") e que "não tem qualquer filiação à Câmara Municipal, a partidos políticos ou a qualquer instituição pública ou privada".
    source: https://lisboaparapessoas.pt/sobre/
