name: RTP – Rádio e Televisão de Portugal
type: Serviço público de rádio e televisão (empresa do Estado)
owner: Estado português (100%)
summary: >
  Empresa pública. A administração é escolhida pelo Conselho Geral Independente
  (CGI), um órgão criado para afastar o Governo da escolha direta. Os diretores
  de informação precisam de parecer vinculativo da ERC.
funding:
  - text: A Contribuição Audiovisual (3,02 euros por mês, cobrada na fatura da eletricidade) rendeu 195,7 milhões de euros em 2025, 82,3% das receitas; as receitas comerciais foram de 39,8 milhões.
    source:
      - https://www.rtp.pt/noticias/economia/cgi-da-rtp-sugere-subvencao-no-oe-caso-contribuicao-audiovisual-nao-aumente_n1708262
      - https://eco.sapo.pt/2026/04/29/apos-15-anos-de-lucros-rtp-regista-prejuizo-de-quase-quatro-milhoes-em-2025/
  - text: Em 2025 teve um prejuízo de 3,97 milhões de euros, o primeiro em 15 anos, com receitas de 237,8 milhões; a administração atribuiu-o a receitas congeladas desde 2016 e ao aumento dos custos.
    source: https://eco.sapo.pt/2026/04/29/apos-15-anos-de-lucros-rtp-regista-prejuizo-de-quase-quatro-milhoes-em-2025/
political_links:
  official:
    - text: O Conselho Geral Independente tem seis membros — dois designados pelo Governo, dois pelo Conselho de Opinião e dois cooptados — e escolhe a administração; a nomeação do administrador financeiro depende de parecer prévio vinculativo do ministro das Finanças.
      source:
        - https://www.rtp.pt/noticias/economia/goncalo-almeida-ribeiro-aprovado-pelo-governo-para-cgi-da-rtp_n1724727
        - https://cdn-images.rtp.pt/mcm/pdf/6a8/6a87285a820cc65f1988f220a989c1bc1.pdf
  reported:
    - text: Alberto Arons de Carvalho, designado para o CGI em novembro de 2020 para seis anos, foi substituído pelo Governo em 2026 por Gonçalo Almeida Ribeiro antes da data que considerava ser o fim do mandato; queixou-se à ERC, que arquivou o caso por entender que a legalidade deve ser apreciada pelos tribunais.
      source:
        - https://eco.sapo.pt/2026/03/26/erc-arquiva-queixa-de-arons-de-carvalho-por-afastamento-do-cgi-da-rtp/
        - https://www.rtp.pt/noticias/economia/goncalo-almeida-ribeiro-aprovado-pelo-governo-para-cgi-da-rtp_n1724727
narrative:
  - text: Em 2025 a destituição do diretor de informação António José Teixeira levou a administração ao parlamento; o presidente, Nicolau Santos, disse que "não houve nenhuma interferência política". A ERC, que dá parecer vinculativo sobre a nomeação dos diretores de informação, lembrou que a RTP tinha de ouvir antes o Conselho de Redação.
    source:
      - https://www.dn.pt/media-geral/nicolau-santos-afasta-qualquer-interfer%C3%AAncia-pol%C3%ADtica-ou-press%C3%A3o-para-reorganiza%C3%A7%C3%A3o-na-rtp
      - https://eco.sapo.pt/2025/07/08/erc-diz-que-rtp-tem-de-pedir-parecer-do-conselho-de-redacao-para-destituicao-na-direcao-de-informacao/
  - text: Em 2024 Alberto Arons de Carvalho, então membro do CGI, classificou de "erro crasso" as contas do Governo sobre o fim gradual da publicidade na RTP — o Governo previa perder 18 milhões de euros em três anos; ele calculou 36 milhões.
    source: https://observador.pt/2024/10/17/erro-crasso-conselho-geral-independente-da-rtp-diz-que-governo-fez-mal-as-contas-ao-fim-da-publicidade/
owners:
