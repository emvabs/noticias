name: BBC News
type: Serviço público de rádio e televisão do Reino Unido
owner: British Broadcasting Corporation, entidade pública criada por Carta Real (Royal Charter)
summary: >
  Emissora pública britânica, regida por uma Carta Real que termina no fim de
  2027 e financiada sobretudo pela taxa de televisão, fixada pelo Governo. O
  Governo está a rever a Carta e o modelo de financiamento. É regulada pela
  Ofcom.
funding:
  - text: Financiada sobretudo pela taxa de televisão (licence fee), que o Governo fixou em 180 libras por ano a partir de abril de 2026, mais receitas comerciais. Em dezembro de 2025 o Governo abriu a revisão da Carta Real, que termina a 31 de dezembro de 2027, com opções para mudar o financiamento a partir de 2028.
    source:
      - https://commonslibrary.parliament.uk/research-briefings/cbp-10050/
      - https://www.gov.uk/government/news/cost-of-tv-licence-fee-set-for-202627
political_links:
  official:
    - text: O Governo fixa o valor da taxa de televisão; o presidente do conselho da BBC é nomeado pelo Rei, em Conselho Privado, por recomendação do ministro da Cultura e do primeiro-ministro, depois de uma audição no Parlamento.
      source:
        - https://www.gov.uk/government/news/cost-of-tv-licence-fee-set-for-202627
        - https://gov.uk/government/news/government-announces-preferred-candidate-for-bbc-chair--2
  reported: []
narrative:
  - text: Em novembro de 2025 o diretor-geral, Tim Davie, e a diretora de notícias, Deborah Turness, demitiram-se depois de se saber que o Panorama tinha montado um discurso de Donald Trump de forma enganadora. Trump processou a BBC na Florida, pedindo até 10 mil milhões de dólares; a BBC pediu o arquivamento e o julgamento está marcado para fevereiro de 2027. Matt Brittin é diretor-geral desde maio de 2026.
    source:
      - https://www.euronews.com/2025/11/10/bbc-receives-letter-from-donald-trump-threatening-legal-action-over-edited-speech
      - https://www.advanced-television.com/2026/07/17/trump-drops-bbcs-commercial-arm-from-panorama-lawsuit/
      - https://advanced-television.com/2026/03/25/brittin-confirmed-as-next-bbc-director-general/
  - text: Em outubro de 2025 a Ofcom concluiu que o documentário "Gaza — How to Survive a Warzone" induziu o público em erro de forma material, por não revelar que o pai do narrador tinha um cargo na administração do Hamas.
    source: https://www.ofcom.org.uk/tv-radio-and-on-demand/broadcast-standards/ofcom-investigation-finds-bbc-gaza-documentary-in-breach-of-broadcasting-code
owners:
  - name: Estado britânico
    share: 100
    kind: public
    source: https://commonslibrary.parliament.uk/research-briefings/cbp-10050/
owner_keywords: [Royal Charter, Samir Shah, Matt Brittin, Tim Davie, BBC Studios]
last_checked: 2026-09-27
