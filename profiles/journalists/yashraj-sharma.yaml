name: Yashraj Sharma
role: Repórter da Al Jazeera em Nova Deli (Sul da Ásia)
summary: >
  Cobre direitos humanos, o conflito em Caxemira e a ascensão do nacionalismo
  hindu. Entre 2018 e 2023 viveu em Caxemira e trabalhou para The Kashmir
  Walla, de que foi editor interino depois da prisão de responsáveis da revista
  em 2022.
