name: Mário Rui André
role: Cofundador do Shifter; diretor e editor do Lisboa Para Pessoas
summary: >
  Fundou o Shifter com João Gabriel Ribeiro em 2013 e coordena o Lisboa Para
  Pessoas desde 2020. É sócio-gerente da Shifter Generation, dona dos dois
  títulos. Escreve sobre cidades, mobilidade e digitalização.
