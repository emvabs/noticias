name: Kevin Hand
role: Jornalista de desporto da Al Jazeera (futebol e críquete)
summary: >
  Repórter, editor e comentador de desporto desde 2001. Trabalhou na BBC (rádio,
  televisão e BBC Sport) e na Capital Gold. Escreve e edita a cobertura
  desportiva da Al Jazeera a partir da Irlanda e do Reino Unido.
