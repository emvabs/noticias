name: Andreia Sanches
role: Jornalista do Público (ex-diretora-adjunta)
summary: >
  Entrou no Público em 1996, licenciada em Ciências da Comunicação pela Nova.
  Foi editora do P2 e da Sociedade, editora executiva e diretora-adjunta, e
  voltou à redação como jornalista. Escreve sobre pobreza, desigualdade e
  proteção social.
career:
  - text: Deixou a direção do Público e continua na redação.
