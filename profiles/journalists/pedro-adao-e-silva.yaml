name: Pedro Adão e Silva
role: Sociólogo, professor no ISCTE e colunista do Público; ex-ministro da Cultura
summary: >
  Doutorado pelo Instituto Universitário Europeu (Florença) e professor na
  Escola de Sociologia e Políticas Públicas do ISCTE. Escreve no Público como
  colunista, não como repórter.
career:
  - text: Comissário executivo das comemorações dos 50 anos do 25 de Abril antes de entrar no Governo.
    source: https://www.publico.pt/2022/03/23/culturaipsilon/noticia/pedro-adao-silva-novo-ministro-cultura-1999929
political_links:
  official:
    - text: Ministro da Cultura no XXIII Governo Constitucional (PS, António Costa), de 2022 a 2024.
      source: https://portugal.gov.pt/pt/gc23/area-de-governo/cultura/ministro
    - text: Membro do Secretariado Nacional do PS entre 2002 e 2004, com Ferro Rodrigues.
      source: https://ffms.pt/pt-pt/autores/pedro-adao-e-silva
  reported: []
narrative:
  - text: Comenta regularmente o futuro do PS (por exemplo, "PS será dos populistas económicos ou dos centristas liberais", 2025).
    source: https://www.publico.pt/2025/05/23/politica/noticia/pedro-adao-silva-ps-sera-populistas-economicos-centristas-liberais-2134013
last_checked: 2026-09-27
