name: Maria Almeida
role: Jornalista e cofundadora do Fumaça
summary: >
  Jornalista do Porto, licenciada em Jornalismo pela Universidade Nova de Lisboa.
  Cofundou o Fumaça e trabalha lá a tempo inteiro desde 2021, ano em que obteve a
  carteira profissional.
career:
  - text: Com Ricardo Esteves Ribeiro, fez a série "Palestina — Histórias de um país ocupado" (Prémio Gazeta Revelação 2018; prémios de júri e do público nos Prémios de Ciberjornalismo 2019).
    source: https://www.femina.pt/maria-almeida/
  - text: Autora da série "Quase da Família", sobre trabalhadoras domésticas.
    source: https://antena3.rtp.pt/video/voz-de-cama/o-trabalho-domestico-com-maria-almeida/
political_links:
  official: []
  reported: []
narrative:
  - text: Trabalha num projeto que assume uma agenda editorial contra desigualdades e "sistemas de opressão" (ver o perfil do Fumaça).
    source: https://fumaca.pt/sobre/
last_checked: 2026-09-27
