role: Redatora principal do Público (política)
summary: >
  Jornalista de política. Foi jornalista parlamentar e editora de Política no
  Público, passou pelo Diário de Notícias e fez parte da equipa fundadora do
  jornal i, onde foi diretora-adjunta. Voltou ao Público em 2018 como
  diretora-adjunta e é hoje redatora principal.
