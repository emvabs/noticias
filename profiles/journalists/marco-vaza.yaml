name: Marco Vaza
role: Jornalista de desporto do Público
summary: >
  Está na secção de Desporto do Público desde 1999 (entre 2006 e 2009 foi editor
  da revista de domingo). Cobriu os Jogos Olímpicos de Atenas 2004 e Londres
  2012. Criou, com Tiago Pimentel, a secção semanal "Planisférico".
