name: Joana Gorjão Henriques
role: Jornalista do Público (racismo, imigração, direitos humanos)
summary: >
  Está no Público desde 1999: começou na Cultura e, desde 2012, dedica-se a
  racismo, imigração e pós-colonialismo português.
career:
  - text: Autora de "Racismo em Português" e "Racismo à Portuguesa", séries de reportagem publicadas em livro pela Tinta-da-China.
    source: https://tintadachina.pt/produto/racismo-em-portugues-2/
  - text: Prémio Gazeta de Imprensa 2017; medalha de ouro do Prémio Direitos Humanos da Assembleia da República (2018).
    source: https://pt.wikipedia.org/wiki/Joana_Gorj%C3%A3o_Henriques
political_links:
  official: []
  reported: []
narrative:
  - text: Os livros e séries dela descrevem o racismo estrutural na sociedade portuguesa e as heranças do colonialismo.
    source: https://pt.wikipedia.org/wiki/Joana_Gorj%C3%A3o_Henriques
