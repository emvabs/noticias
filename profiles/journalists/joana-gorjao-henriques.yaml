name: Joana Gorjão Henriques
role: Jornalista do Público (racismo, imigração, direitos humanos)
summary: >
  Está no Público desde o fim de 1999; passou cerca de uma década na secção de
  Cultura e dedica-se depois a direitos humanos, racismo e discriminação.
career:
  - text: Autora de "Racismo em Português — O lado esquecido do colonialismo" (2016) e "Racismo no País dos Brancos Costumes" (2018), ambos na Tinta-da-China.
    source:
      - https://ces.uc.pt/en/ces/nucleos/nhumep/eventos/2017/racismo-em-portugues-o-lado-esquecido-do-colonialismo
      - https://openlibrary.org/works/OL44314611W
  - text: Prémio Gazeta de Imprensa 2017 pela série de reportagens "Racismo à portuguesa", no Público.
    source: https://www.clubedejornalistas.pt/?page_id=14738
  - text: Medalha de ouro do Prémio Direitos Humanos da Assembleia da República (2018).
    source: https://www.parlamento.pt/Cidadania/Paginas/Premio-Direitos-Humanos.aspx
political_links:
  official: []
  reported: []
narrative:
  - text: As reportagens e livros dela tratam as desigualdades raciais em Portugal (habitação, emprego, educação) e o racismo como instrumento da dominação colonial.
    source:
      - https://www.parlamento.pt/Cidadania/Paginas/Premio-Direitos-Humanos.aspx
      - https://ces.uc.pt/en/ces/nucleos/nhumep/eventos/2017/racismo-em-portugues-o-lado-esquecido-do-colonialismo
last_checked: 2026-09-27
