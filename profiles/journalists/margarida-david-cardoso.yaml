name: Margarida David Cardoso
role: Jornalista de investigação do Fumaça
summary: >
  Jornalista. Começou no Público em 2016 e está na redação autogerida do Fumaça
  desde 2019.
career:
  - text: Entrou no Público em 2016 e passou para a redação autogerida do Fumaça em 2019.
    source: https://ffms.pt/en/authors/margarida-david-cardoso
  - text: Prémio Gazeta Revelação 2017 com "A noite do fim do mundo", sobre as cheias de 1967.
    source: https://www.clubedejornalistas.pt/?page_id=14738
  - text: Coordenou os livros "Anos Verdes — Retratos da Juventude" e "E depois da Revolução — Cinco Décadas de Democracia" para a Fundação Francisco Manuel dos Santos.
    source: https://ffms.pt/en/authors/margarida-david-cardoso
