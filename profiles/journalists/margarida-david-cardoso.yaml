name: Margarida David Cardoso
role: Jornalista de investigação do Fumaça
summary: >
  Licenciada em Ciências da Comunicação pela Universidade do Porto. Começou no
  Público em 2016 e está na redação autogerida do Fumaça desde 2019.
career:
